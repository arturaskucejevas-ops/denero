[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Puslapių nukreipimai – faile public/_redirects (tinka ir Cloudflare Pages).

# Netlify adresas → pagrindinis domenas
[[redirects]]
  from = "https://deneroweb.netlify.app/*"
  to = "https://denero.eu/:splat"
  status = 301
  force = true
